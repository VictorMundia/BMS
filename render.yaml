services:
  - type: web
    name: bms
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py create_superuser_if_not_exists
    startCommand: gunicorn butchery_system.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: "*"
