services:
  - type: web
    name: bms
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn butchery_system.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: "*"
databases:
  - name: bms-db
    databaseName: bms
    user: bms

# Run migrations after database is created
preDeployCommand: python manage.py migrate --noinput
