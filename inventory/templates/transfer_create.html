{% extends 'base.html' %}
{% block title %}Request Stock Transfer - BMS{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-6">
        <h1 class="text-xl font-bold text-gray-900 mb-6">Request Stock Transfer</h1>

        {% if form.non_field_errors %}
            <div class="mb-4 p-3 rounded-lg bg-red-100 text-red-800 text-sm">{{ form.non_field_errors }}</div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900">From Butchery</label>
                <select name="{{ form.from_butchery.html_name }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 block w-full p-2.5">
                    {% for value, label in form.from_butchery.field.choices %}
                        <option value="{{ value }}" {% if form.from_butchery.value|stringformat:'s' == value|stringformat:'s' %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900">To Butchery</label>
                <select name="{{ form.to_butchery.html_name }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 block w-full p-2.5">
                    {% for value, label in form.to_butchery.field.choices %}
                        <option value="{{ value }}" {% if form.to_butchery.value|stringformat:'s' == value|stringformat:'s' %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900">Product</label>
                <select name="{{ form.product.html_name }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 block w-full p-2.5">
                    {% for value, label in form.product.field.choices %}
                        <option value="{{ value }}" {% if form.product.value|stringformat:'s' == value|stringformat:'s' %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900">Quantity</label>
                <input type="number" step="0.01" name="{{ form.quantity.html_name }}" value="{{ form.quantity.value|default_if_none:'' }}"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 block w-full p-2.5">
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900">Notes</label>
                <textarea name="{{ form.notes.html_name }}" rows="2" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 block w-full p-2.5">{{ form.notes.value|default_if_none:'' }}</textarea>
            </div>
            <div class="flex items-center gap-3">
                <button type="submit" class="text-white bg-purple-600 hover:bg-purple-700 focus:ring-4 focus:ring-purple-300 font-medium rounded-lg text-sm px-5 py-2.5">Request Transfer</button>
                <a href="{% url 'home' %}" class="text-gray-700 bg-gray-100 hover:bg-gray-200 font-medium rounded-lg text-sm px-5 py-2.5">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
